<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0e22;overflow:hidden}</style></head>
<body>
<script type="module">
// 2.5D set: rainy city street at night, flat character cutout standing in a real 3D world.
import * as THREE from './three.module.min.js';
const Q = new URLSearchParams(location.search);
const TT = parseFloat(Q.get('T') ?? 5);
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e22);
scene.fog = new THREE.FogExp2(0x141a3a, 0.035);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 300);

scene.add(new THREE.HemisphereLight(0x6a7bd0, 0x10132a, 0.55));
const moon = new THREE.DirectionalLight(0x9fb4ff, 0.5); moon.position.set(-10, 20, 10); scene.add(moon);

// wet road + sidewalks
const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 140), new THREE.MeshStandardMaterial({ color: 0x15182c, roughness: 0.15, metalness: 0.6 }));
road.rotation.x = -Math.PI / 2; road.receiveShadow = true; scene.add(road);
for (const sx of [-1, 1]) {
  const walk = new THREE.Mesh(new THREE.BoxGeometry(5, 0.3, 140), new THREE.MeshStandardMaterial({ color: 0x2a2f4a, roughness: 0.7 }));
  walk.position.set(sx * 9.5, 0.15, 0); walk.receiveShadow = true; scene.add(walk);
}
// lane dashes
for (let z = -66; z < 66; z += 6) {
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 2.4), new THREE.MeshBasicMaterial({ color: 0xd8c27a }));
  dash.rotation.x = -Math.PI / 2; dash.position.set(0, 0.01, z); scene.add(dash);
}

// window texture for buildings
function windowTex(seed, warm) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#1b2140'; g.fillRect(0, 0, 256, 512);
  let s = seed;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let y = 16; y < 512; y += 36) for (let x = 14; x < 256; x += 40) {
    const on = rnd() > 0.45;
    g.fillStyle = on ? (warm ? '#ffd27a' : '#9fd0ff') : '#262d52';
    g.fillRect(x, y, 22, 22);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
for (const sx of [-1, 1]) {
  for (let i = 0; i < 14; i++) {
    const h = 10 + ((i * 37) % 17), w = 7 + (i % 3), d = 8;
    const tex = windowTex(i * 13 + (sx > 0 ? 5 : 0), i % 2 === 0);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(w / 7, h / 12);
    const mat = new THREE.MeshStandardMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: 0.8 });
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    b.position.set(sx * (12 + w / 2), h / 2, 60 - i * 9.2); scene.add(b);
  }
}
// street lamps
for (let z = 40; z > -60; z -= 16) for (const sx of [-1, 1]) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 6, 8), new THREE.MeshStandardMaterial({ color: 0x3a3f5a }));
  pole.position.set(sx * 7.6, 3, z); scene.add(pole);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffe2a0 }));
  bulb.position.set(sx * 7.0, 6, z); scene.add(bulb);
  const l = new THREE.PointLight(0xffc878, 18, 14, 1.6); l.position.copy(bulb.position); scene.add(l);
}
// newsstand with headline
function label(text, bg, fg, w = 1024, h = 360, size = 120) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = fg; g.font = `900 ${size}px Inter, Arial Black, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  text.split('\n').forEach((ln, i, a) => g.fillText(ln, w / 2, h / 2 + (i - (a.length - 1) / 2) * size * 1.1));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const stand = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.6, 1.6), new THREE.MeshStandardMaterial({ color: 0x2f6a4a, roughness: 0.6 }));
body.position.y = 1.3; stand.add(body);
const roof = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.25, 2.0), new THREE.MeshStandardMaterial({ color: 0x1e4a33 }));
roof.position.y = 2.75; stand.add(roof);
const head = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 1.15), new THREE.MeshBasicMaterial({ map: label('MARKET\nCRASHES', '#f4efe2', '#c4202e', 1024, 400, 150) }));
head.position.set(0, 1.55, 0.81); stand.add(head);
const sub = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 0.45), new THREE.MeshBasicMaterial({ map: label('S&P 500  -37% · 2008', '#f4efe2', '#202020', 1024, 160, 80) }));
sub.position.set(0, 0.7, 0.81); stand.add(sub);
stand.position.set(4.6, 0.3, -6); stand.rotation.y = -0.35; scene.add(stand);
const standLight = new THREE.PointLight(0xfff0d0, 10, 8); standLight.position.set(4.0, 3.5, -4.5); scene.add(standLight);

// flat character cutout (2D sprite standing in the 3D world)
const tl = new THREE.TextureLoader();
const jayTex = tl.load('sprites/jay.png'); jayTex.colorSpace = THREE.SRGBColorSpace;
const JH = 3.4, JW = JH * 455 / 1281;
const jay = new THREE.Mesh(new THREE.PlaneGeometry(JW, JH), new THREE.MeshStandardMaterial({ map: jayTex, transparent: true, alphaTest: 0.5, roughness: 0.9, side: THREE.DoubleSide }));
jay.position.set(1.6, JH / 2 + 0.3, -4.2); jay.castShadow = true; scene.add(jay);
const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.9, 24), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 }));
shadow.rotation.x = -Math.PI / 2; shadow.scale.set(1, 0.45, 1); shadow.position.set(1.6, 0.31, -4.1); scene.add(shadow);
const key = new THREE.SpotLight(0xffe0b0, 40, 20, 0.5, 0.6); key.position.set(-1, 7, 2); key.target = jay; scene.add(key);

// rain
const N = 2600, rp = new Float32Array(N * 6), seeds = [];
for (let i = 0; i < N; i++) seeds.push([(Math.random() - .5) * 30, Math.random() * 18, (Math.random() - .5) * 60 - 5, 0.6 + Math.random() * 0.5]);
const rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.BufferAttribute(rp, 3));
scene.add(new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: 0xa8b8ff, transparent: true, opacity: 0.55 })));
function rain(t) {
  for (let i = 0; i < N; i++) {
    const [x, y0, z, sp] = seeds[i];
    const y = ((y0 - t * 22 * sp) % 18 + 18) % 18;
    rp.set([x, y, z, x - 0.05, y + 0.55, z], i * 6);
  }
  rg.attributes.position.needsUpdate = true;
}

const ease = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
window.renderAt = (t) => {
  const u = ease(t / TT);
  // dolly down the street toward Jay, drifting right and slightly down
  camera.position.set(-1.6 + 2.6 * u, 3.0 - 0.9 * u, 18 - 13.0 * u);
  camera.lookAt(2.4 + 0.4 * u, 1.9 - 0.1 * u, -4.8);
  rain(t);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.92);
};
const wait = () => (jayTex.image ? (window.ready = true) : setTimeout(wait, 50));
wait();
</script>
</body></html>
