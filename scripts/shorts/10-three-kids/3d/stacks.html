<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111630;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from './three.module.min.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111630);
scene.fog = new THREE.Fog(0x111630, 22, 48);

const camera = new THREE.PerspectiveCamera(46, W / H, 0.1, 200);

// lights
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1f3d, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(6, 14, 8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x7aa2ff, 1.2); rim.position.set(-8, 6, -10); scene.add(rim);

// floor with soft grid
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x1b2246, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(60, 60, 0x2c3770, 0x232c5a); grid.position.y = 0.002; scene.add(grid);

// stars
const sg = new THREE.BufferGeometry(); const sp = [];
for (let i = 0; i < 600; i++) sp.push((Math.random() - .5) * 120, 8 + Math.random() * 50, -30 - Math.random() * 40);
sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0x7080b0, size: 0.18 })));

// coin stacks: Jay $770 (red), Maya $6,374 (yellow), Sam $8,061 (green)
const data = [
  { name: 'JAY', amt: 770, color: 0xeb4852, x: -2.7, t0: 0.6 },
  { name: 'MAYA', amt: 6374, color: 0xfacc40, x: 0, t0: 1.2 },
  { name: 'SAM', amt: 8061, color: 0x40c46e, x: 2.7, t0: 1.8 },
];
const COIN_H = 0.22, PER_COIN = 250; // each coin = $250
const coinGeo = new THREE.CylinderGeometry(1.0, 1.0, COIN_H * 0.92, 48);
const stacks = data.map(d => {
  const n = Math.max(3, Math.round(d.amt / PER_COIN));
  const mat = new THREE.MeshStandardMaterial({ color: d.color, metalness: 0.55, roughness: 0.32 });
  const edge = new THREE.MeshStandardMaterial({ color: new THREE.Color(d.color).multiplyScalar(0.7), metalness: 0.6, roughness: 0.4 });
  const coins = [];
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(coinGeo, [edge, mat, mat]);
    m.castShadow = true; m.receiveShadow = true;
    m.position.set(d.x + (Math.random() - .5) * 0.06, -5, (Math.random() - .5) * 0.06);
    m.rotation.y = Math.random() * Math.PI;
    scene.add(m); coins.push(m);
  }
  return { ...d, coins, n };
});

// text labels as sprites
function makeLabel(text, color, size = 160, w = 1024, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.font = `900 ${size}px Inter, Arial Black, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = size / 7; g.strokeStyle = '#0a0c1e'; g.strokeText(text, w / 2, h / 2);
  g.fillStyle = color; g.fillText(text, w / 2, h / 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(w / 256, h / 256, 1); return s;
}
const hex = c => '#' + c.toString(16).padStart(6, '0');
stacks.forEach(s => {
  s.amtLabel = makeLabel('$' + s.amt.toLocaleString('en-US'), hex(s.color));
  s.nameLabel = makeLabel(s.name, '#f5f5fa', 120);
  s.nameLabel.position.set(s.x, 0.55, 1.9); s.nameLabel.scale.set(3.4,0.85,1);
  scene.add(s.amtLabel, s.nameLabel);
});
const title = makeLabel('END OF 2025', '#f5f5fa', 130, 1400, 256);
title.scale.multiplyScalar(1.1); scene.add(title);
const tag = makeLabel('SAM = 10x JAY', '#ffc43c', 150, 1400, 320);
scene.add(tag);

const ease = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
const easeOutBack = x => { x = Math.min(Math.max(x, 0), 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

window.renderAt = (t) => {
  // camera: sweep around and rise
  const a = -0.42 + 0.42 * ease(t / 5);
  const r = 20 - 3 * ease(t / 5);
  camera.position.set(Math.sin(a) * r, 4 + 3 * ease(t / 5), Math.cos(a) * r);
  camera.lookAt(0.3, 4.4, 0);

  stacks.forEach(s => {
    const dur = 0.9 + s.n * 0.035;
    s.coins.forEach((m, i) => {
      const ti = s.t0 + (i / s.n) * dur;
      const u = ease((t - ti) / 0.35);
      const target = COIN_H * (i + 0.5);
      m.position.y = u <= 0 ? -5 : target + (1 - u) * 3.5;
      m.visible = u > 0;
    });
    const shown = s.coins.filter(m => m.visible).length;
    const topY = COIN_H * shown;
    const k = easeOutBack((t - (s.t0 + dur * 0.6)) / 0.4);
    const val = Math.round(s.amt * ease((t - s.t0) / dur));
    s.amtLabel.visible = t > s.t0 + 0.1;
    if (s.amtLabel.visible) {
      const fresh = makeLabel('$' + val.toLocaleString('en-US'), hex(s.color));
      s.amtLabel.material.map.dispose(); s.amtLabel.material.map = fresh.material.map;
      s.amtLabel.position.set(s.x, COIN_H * s.n + 1.1, 0.5);
      s.amtLabel.scale.set(4.4 * Math.max(k, 0.85), 1.1 * Math.max(k, 0.85), 1);
    }
  });
  title.position.set(0, 11.2, -2); title.visible = t > 0.2;
  const tk = easeOutBack((t - 3.9) / 0.45);
  tag.visible = t > 3.9;
  tag.position.set(0, 9.0, 1.5); tag.scale.set(5.6 * tk, 1.75 * tk, 1);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.92);
};
window.ready = true;
</script>
</body></html>
