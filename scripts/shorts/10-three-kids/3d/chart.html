<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111630;overflow:hidden}</style></head>
<body>
<script type="module">
// Reusable 3D "fly along the chart" scene.
// Query: T (seconds), start (dollars), title, data = comma list of yearly % returns, y0 = first year.
import * as THREE from './three.module.min.js';
const Q = new URLSearchParams(location.search);
const TT = parseFloat(Q.get('T') ?? 8);
const START = parseFloat(Q.get('start') ?? 1000);
const Y0 = parseInt(Q.get('y0') ?? 2006);
const RET = (Q.get('data') ?? '15.79,5.49,-37.00,26.46,15.06,2.11,16.00,32.39,13.69,1.38,11.96,21.83,-4.38,31.49,18.40,28.71,-18.11,26.29,25.02,17.88').split(',').map(Number);
const TITLE = Q.get('title') ?? 'S&P 500 · $1,000 · 2006–2025';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111630);
scene.fog = new THREE.Fog(0x111630, 18, 60);
const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1f3d, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(5, 12, 10); scene.add(key);

// values: start of Y0 = START, then year-end values
const vals = [START];
RET.forEach(r => vals.push(vals[vals.length - 1] * (1 + r / 100)));
const N = vals.length;               // points: start + each year end
const XS = 2.2;                      // spacing per year
const yOf = v => Math.log10(v / START) * 9 + 1; // log scale keeps crash + growth readable
const pts = vals.map((v, i) => new THREE.Vector3(i * XS, yOf(v), 0));

// floor grid + year ticks
const grid = new THREE.GridHelper(N * XS * 2, N * 2, 0x2c3770, 0x1f2852); grid.position.set(N * XS / 2, -0.6, 0); scene.add(grid);

// ribbon (extruded tube) built progressively
const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.1);
const tubeMatUp = new THREE.MeshStandardMaterial({ color: 0x40c46e, emissive: 0x0f3a1e, roughness: 0.35, metalness: 0.2 });
let tube = null;
function buildTube(frac) {
  if (tube) { scene.remove(tube); tube.geometry.dispose(); }
  const segs = Math.max(2, Math.floor(frac * 400));
  const sub = new THREE.CatmullRomCurve3(curve.getSpacedPoints(400).slice(0, segs + 1));
  tube = new THREE.Mesh(new THREE.TubeGeometry(sub, segs, 0.42, 12, false), tubeMatUp);
  scene.add(tube);
}
// area "wall" under the line for depth
const wallMat = new THREE.MeshBasicMaterial({ color: 0x40c46e, transparent: true, opacity: 0.12, side: THREE.DoubleSide });

// labels
function sprite(text, color, size = 150, w = 1024, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.font = `900 ${size}px Inter, Arial Black, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = size / 7; g.strokeStyle = '#0a0c1e'; g.strokeText(text, w / 2, h / 2);
  g.fillStyle = color; g.fillText(text, w / 2, h / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  s.scale.set(w / 256, h / 256, 1); return s;
}
// year markers every 2 years + 2008 crash marker
for (let i = 0; i < N; i++) {
  const yr = Y0 + i;
  if (i % 2 === 0 || yr === 2008) {
    const s = sprite(String(yr), yr === 2009 ? '#eb4852' : '#9aa6d8', 110);
    s.position.set(i * XS, -0.1, 1.6); s.scale.set(2.2, 0.55, 1); scene.add(s);
  }
}
const crashI = RET.findIndex(r => r < -30) + 1; // end of crash year
const crash = sprite('2008 CRASH −37%', '#eb4852', 120, 1400, 256);
crash.position.set(crashI * XS, pts[crashI].y - 1.6, 0.5); crash.scale.set(5.2, 0.95, 1); scene.add(crash);

const counter = sprite('', '#40c46e', 170, 1400, 300); scene.add(counter);
const finalLbl = sprite('$1,000 → $' + Math.round(vals[vals.length-1]).toLocaleString('en-US'), '#40c46e', 150, 1800, 300); scene.add(finalLbl);
const title = sprite(TITLE, '#f5f5fa', 90, 2048, 256); scene.add(title);
const dot = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x40c46e, emissiveIntensity: 0.9 }));
scene.add(dot);
const glow = new THREE.PointLight(0x40c46e, 30, 12); scene.add(glow);

const ease = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
let lastTxt = '';
window.renderAt = (t) => {
  const u = ease(t / (TT - 0.6));
  buildTube(Math.max(u, 0.003));
  const p = curve.getPointAt(Math.min(u, 0.999));
  const fi = u * (N - 1), i0 = Math.floor(fi), i1 = Math.min(N - 1, i0 + 1);
  const v = vals[i0] + (vals[i1] - vals[i0]) * (fi - i0);
  const col = v < START ? '#eb4852' : '#40c46e';
  dot.position.copy(p); glow.position.copy(p);
  const txt = '$' + Math.round(v).toLocaleString('en-US');
  if (txt !== lastTxt) {
    const n = sprite(txt, col, 170, 1400, 300);
    counter.material.map.dispose(); counter.material.map = n.material.map; lastTxt = txt;
  }
  counter.position.set(p.x, p.y + 2.6, 0); counter.scale.set(6.4, 1.4, 1);
  crash.visible = u > (crashI - 0.6) / (N - 1) && ease((t - (TT - 1.6)) / 1.3) < 0.3;
  // camera chases the dot, low and to the side, pulls back at the end
  const back = ease((t - (TT - 1.6)) / 1.3);
  const chase = new THREE.Vector3(p.x - 9, p.y + 4, 18);
  const look = new THREE.Vector3(p.x - 1, p.y + 1.5, 0);
  const endPos = new THREE.Vector3(-7, 4, 9);
  const endLook = new THREE.Vector3(pts[N - 1].x * 0.75, pts[N - 1].y * 0.7, -2);
  camera.position.copy(chase.lerp(endPos, back));
  camera.lookAt(look.lerp(endLook, back));
  title.position.set(camera.position.x + 4, camera.position.y + 7.5, camera.position.z - 14); title.scale.set(9, 1.1, 1);
  scene.fog.far = 60 + back * 90;
  finalLbl.visible = back > 0.35;
  if (finalLbl.visible) {
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    const up = camera.up.clone();
    finalLbl.position.copy(camera.position).add(dir.multiplyScalar(14)).add(up.multiplyScalar(6.2));
    const k = ease((back - 0.35) / 0.3); finalLbl.scale.set(9 * k, 2.2 * k, 1);
    counter.visible = false;
  } else counter.visible = true;
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.92);
};
window.ready = true;
</script>
</body></html>
