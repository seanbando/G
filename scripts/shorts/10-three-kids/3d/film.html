<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#07081a;overflow:hidden}</style></head>
<body>
<script type="module">
// 2.5D film for "Same $1,000, Same S&P 500": a 3D set per line, flat characters with changing
// faces, spotlight + vignette lighting, props that carry the words, particles, handheld shake.
import * as THREE from './three.module.min.js';
const W = 1080, H = 1920;
const WORDS = await (await fetch('words.json')).json();
const L = Object.fromEntries(WORDS.lines.map(l => [l.id, l]));
const wt = (line, word, n = 0) => WORDS.words.filter(w => w.line === line && w.text.toLowerCase().replace(/[.,?!:]/g, '') === word)[n].start;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.75;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(48, W / H, 0.1, 400);

// ---------- helpers ----------
const loader = new THREE.TextureLoader();
const texCache = {};
function spriteTex(name) {
  if (!texCache[name]) { const t = loader.load('sprites/' + name + '.png'); t.colorSpace = THREE.SRGBColorSpace; texCache[name] = t; }
  return texCache[name];
}
const SPRITES = ['jay_worried_hold_box', 'jay_shocked_hold_box', 'jay_smug_hold_box', 'jay_cry_hold', 'jay_neutral_hold', 'jay_worried_hold',
  'maya_worried_hold', 'maya_shocked_hold', 'maya_neutral_hold', 'maya_neutral_up', 'maya_cry_hold',
  'sam_happy_hold', 'sam_grin_up', 'sam_smug_hold', 'sam_neutral_hold', 'sam_happy_up', 'you'];
SPRITES.forEach(spriteTex);
function person(name, x, z, h = 3.4, y = 0) {
  const t = spriteTex(name);
  const asp = t.image ? t.image.width / t.image.height : 0.4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(h * asp, h), new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: 0.5, roughness: 0.9, side: THREE.DoubleSide }));
  m.position.set(x, y + h / 2, z);
  const sh = new THREE.Mesh(new THREE.CircleGeometry(h * 0.26, 24), new THREE.MeshBasicMaterial({ color: 0, transparent: true, opacity: 0.5 }));
  sh.rotation.x = -Math.PI / 2; sh.scale.set(1, 0.4, 1); sh.position.set(x, y + 0.02, z + 0.05);
  const g = new THREE.Group(); g.add(m, sh); return g;
}
function canvasTex(draw, w = 1024, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function textPlane(text, { w = 4, h = 1.2, bg = null, fg = '#fff', size = 150, glow = null, font = '900' } = {}) {
  const tex = canvasTex((g, cw, ch) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, cw, ch); }
    const lines = text.split('\n');
    let fs = size;
    g.font = `${font} ${fs}px Inter, Arial Black, sans-serif`;
    while (fs > 20 && Math.max(...lines.map(l => g.measureText(l).width)) > cw * 0.92) { fs -= 6; g.font = `${font} ${fs}px Inter, Arial Black, sans-serif`; }
    size = fs; g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((ln, i) => {
      const y = ch / 2 + (i - (lines.length - 1) / 2) * size * 1.08;
      if (glow) { g.shadowColor = glow; g.shadowBlur = 40; }
      g.lineWidth = size / 8; g.strokeStyle = '#0a0b1e'; if (!bg) g.strokeText(ln, cw / 2, y);
      g.fillStyle = fg; g.fillText(ln, cw / 2, y);
    });
  }, 1024, Math.round(1024 * h / w));
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false }));
}
function box(w, h, d, color, x, y, z, rough = 0.7, emissive = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: rough, emissive, emissiveIntensity: emissive ? 1 : 0 }));
  m.position.set(x, y, z); return m;
}
function spot(color, intensity, x, y, z, tx, ty, tz, angle = 0.45) {
  const s = new THREE.SpotLight(color, intensity, 40, angle, 0.55, 1.2); s.position.set(x, y, z);
  s.target.position.set(tx, ty, tz); const g = new THREE.Group(); g.add(s, s.target); return g;
}
function floor(color, size = 80) {
  const f = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.4 }));
  f.rotation.x = -Math.PI / 2; return f;
}
function windowsTex(seed, lit = '#ffd27a') {
  return canvasTex((g, w, h) => {
    g.fillStyle = '#161b38'; g.fillRect(0, 0, w, h); let s = seed;
    const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let y = 16; y < h; y += 36) for (let x = 14; x < w; x += 40) { g.fillStyle = r() > 0.5 ? lit : '#232a50'; g.fillRect(x, y, 22, 22); }
  }, 256, 512);
}
function city(group, zFrom = 20, zTo = -60, xOff = 11) {
  for (const sx of [-1, 1]) for (let z = zFrom, i = 0; z > zTo; z -= 9, i++) {
    const h = 9 + ((i * 37 + (sx > 0 ? 11 : 0)) % 15), w = 7;
    const t = windowsTex(i * 7 + (sx > 0 ? 3 : 0), i % 2 ? '#ffd27a' : '#9fd0ff'); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1, h / 12);
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 8), new THREE.MeshStandardMaterial({ map: t, emissiveMap: t, emissive: 0xffffff, emissiveIntensity: 0.5 }));
    b.position.set(sx * (xOff + w / 2), h / 2, z); group.add(b);
  }
}
// particles
function particles(group, n, color, area, size = 0.18) {
  const geo = new THREE.BufferGeometry(); const pos = new Float32Array(n * 3); const seed = [];
  for (let i = 0; i < n; i++) seed.push([(Math.random() - .5) * area[0], Math.random() * area[1], (Math.random() - .5) * area[2], 0.6 + Math.random()]);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size, sizeAttenuation: true }));
  pts.userData.update = (t, speed = 3, top = area[1]) => {
    seed.forEach(([x, y0, z, s], i) => { const y = ((y0 - t * speed * s) % top + top) % top; pos.set([x, y, z], i * 3); });
    geo.attributes.position.needsUpdate = true;
  };
  group.add(pts); return pts;
}
function rain(group, n = 2200) {
  const N = n, rp = new Float32Array(N * 6), seeds = [];
  for (let i = 0; i < N; i++) seeds.push([(Math.random() - .5) * 30, Math.random() * 18, (Math.random() - .5) * 50 - 5, 0.6 + Math.random() * .5]);
  const rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.BufferAttribute(rp, 3));
  const ls = new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: 0xa8b8ff, transparent: true, opacity: 0.5 }));
  ls.userData.update = t => { seeds.forEach(([x, y0, z, sp], i) => { const y = ((y0 - t * 22 * sp) % 18 + 18) % 18; rp.set([x, y, z, x - .05, y + .55, z], i * 6); }); rg.attributes.position.needsUpdate = true; };
  group.add(ls); return ls;
}
// vignette + film grain overlay fixed to the camera
const vig = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({
  map: canvasTex((g, w, h) => { const gr = g.createRadialGradient(w / 2, h * 0.45, w * 0.25, w / 2, h * 0.5, w * 0.95); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.62)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }, 512, 910),
  transparent: true, depthTest: false, depthWrite: false, toneMapped: false }));
vig.renderOrder = 999; vig.frustumCulled = false;
camera.add(vig); vig.position.set(0, 0, -1); vig.scale.set(Math.tan(THREE.MathUtils.degToRad(24)) * W / H, Math.tan(THREE.MathUtils.degToRad(24)), 1);

const ease = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
const pop = (t, t0, d = 0.25) => { const u = (t - t0) / d; if (u <= 0) return 0; if (u >= 1) return 1; return u < 0.6 ? ease(u / 0.6) * 1.15 : 1 + 0.15 * (1 - (u - 0.6) / 0.4); };
const lerp = (a, b, u) => a + (b - a) * u;
function shake(t, amt) {
 amt = Math.max(amt, 0.012); return [Math.sin(t * 37) * amt + Math.sin(t * 13) * amt * 0.6, Math.cos(t * 29) * amt * 0.7 + Math.sin(t * 7) * amt * 0.5]; }
function shot(a, b, t, from, to, look0, look1, sh = 0) {
  const r = Math.min(Math.max((t - a) / Math.max(0.01, b - a), 0), 1);
  const u = 0.5 * ease(r) + 0.5 * r;  // keeps moving to the last frame
  const [sx, sy] = shake(t, sh);
  camera.position.set(lerp(from[0], to[0], u) + sx, lerp(from[1], to[1], u) + sy, lerp(from[2], to[2], u));
  camera.lookAt(lerp(look0[0], look1[0], u), lerp(look0[1], look1[1], u), lerp(look0[2], look1[2], u));
}

// ---------- scenes ----------
let current = null, root = null;
const scene = new THREE.Scene(); scene.add(camera);
function setScene(name, build) {
  if (current === name) return;
  if (root) scene.remove(root);
  root = new THREE.Group(); scene.add(root); current = name; build(root);
}

const T = {
  same: wt('VO-01', 'same'), sp: wt('VO-01', 's'), one: wt('VO-01', 'one'), ten: wt('VO-01', 'ten'),
  crash: wt('VO-03', 'crash'),
  shoebox: wt('VO-04', 'shoebox'), maya: L['VO-05'].start, rebound: wt('VO-05', 'rebound'), later: wt('VO-05', 'later'),
  sam: L['VO-06'].start, dividends: wt('VO-06', 'dividends'),
  smart: wt('VO-07', 'smart'), crash2: wt('VO-07', 'crash'),
  mistake: wt('VO-09', 'mistake'), mayaCost: wt('VO-09', 'maya'), q: L['VO-10'].start,
};

function stage(g, accent) {
  scene.background = new THREE.Color(0x07081a); scene.fog = new THREE.FogExp2(0x07081a, 0.03);
  g.add(floor(0x14152c));
  g.add(new THREE.HemisphereLight(0x5060a0, 0x080810, 0.35));
  const back = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: 0x1a1c3a, roughness: 0.9 }));
  back.position.set(0, 10, -9); g.add(back);
  for (let i = -3; i <= 3; i++) { const p = box(0.4, 14, 0.4, accent, i * 4, 7, -8.6, 0.4, accent); p.material.emissiveIntensity = 0.25; g.add(p); }
}

function buildHook(g) {
  stage(g, 0x2a6a4a);
  g.userData.jay = person('jay_neutral_hold', -2.6, 0); g.userData.maya = person('maya_neutral_hold', 0, 0); g.userData.sam = person('sam_happy_hold', 2.6, 0);
  g.add(g.userData.jay, g.userData.maya, g.userData.sam);
  for (const x of [-2.6, 0, 2.6]) g.add(spot(0xfff2d0, 70, x, 9, 3, x, 0, 0, 0.28));
  g.userData.sign = textPlane('S&P 500', { w: 6, h: 1.6, fg: '#5cf08c', glow: '#2cff7a', size: 230 }); g.userData.sign.position.set(0, 6.2, -8.4); g.add(g.userData.sign);
  g.userData.env = [-2.6, 0, 2.6].map(x => { const e = textPlane('$1,000', { w: 1.6, h: 0.8, bg: '#f4efe2', fg: '#1f6b3a', size: 210 }); e.position.set(x, 4.0, 0.4); g.add(e); return e; });
  g.userData.coins = particles(g, 380, 0xffc43c, [2.4, 9, 1.5], 0.22); g.userData.coins.position.set(2.6, 0, 0.3);
  g.userData.tenx = textPlane('10x', { w: 2.4, h: 1.2, fg: '#ffc43c', glow: '#ffb000', size: 300 }); g.userData.tenx.position.set(2.0, 5.0, 0.6); g.add(g.userData.tenx);
}
function hook(t) {
  setScene('hook', buildHook);
  const u = root.userData;
  u.env.forEach((e, i) => { const k = pop(t, T.same - 0.2 + i * 0.12); e.scale.setScalar(Math.max(k, 0.001)); });
  const ks = pop(t, T.sp - 0.1); u.sign.scale.setScalar(Math.max(ks, 0.001));
  const lit = t > T.one - 0.1;
  u.jay.children[0].material.color.setScalar(lit ? 0.35 : 1); u.maya.children[0].material.color.setScalar(lit ? 0.35 : 1);
  u.coins.visible = t > T.ten - 0.15; u.coins.userData.update(t - T.ten, 5, 9);
  const k10 = pop(t, T.ten); u.tenx.scale.setScalar(Math.max(k10, 0.001));
  if (t < T.one - 0.1) shot(0, T.one, t, [0, 3.2, 13], [0, 2.8, 10], [0, 2.4, 0], [0, 2.6, 0]);
  else shot(T.one - 0.1, L['VO-02'].start, t, [3.2, 3.2, 10], [2.6, 3.0, 8.2], [2.4, 3.2, 0], [2.2, 3.4, 0], t > T.ten ? 0.05 : 0.015);
}

function buildYou(g) {
  stage(g, 0x3a4aa0);
  const you = person('you', 0, 0, 4.2); g.add(you);
  g.add(spot(0xffffff, 90, 2, 8, 6, 0, 2.5, 0, 0.35));
  g.userData.q = textPlane('?', { w: 2, h: 2, fg: '#ffc43c', glow: '#ffb000', size: 420 }); g.userData.q.position.set(1.7, 4.4, 0.3); g.add(g.userData.q);
  g.userData.env = [-1.6, 0, 1.6].map((x, i) => { const e = textPlane('$1,000', { w: 1.3, h: 0.65, bg: '#f4efe2', fg: '#1f6b3a', size: 210 }); e.position.set(x, 0.8 + i * 0.1, 1.2); g.add(e); return e; });
}
function youScene(t) {
  setScene('you', buildYou);
  const a = L['VO-02'].start; root.userData.q.scale.setScalar(Math.max(pop(t, a + 0.2), 0.001));
  root.userData.env.forEach((e, i) => e.position.y = 0.8 + Math.sin((t + i) * 4) * 0.12);
  shot(a - 0.1, L['VO-03'].start, t, [0, 3.0, 6.5], [0.2, 3.2, 4.6], [0, 3.0, 0], [0.3, 3.3, 0]);
}

function buildStreet(g) {
  scene.background = new THREE.Color(0x0b0e22); scene.fog = new THREE.FogExp2(0x141a3a, 0.035);
  g.add(new THREE.HemisphereLight(0x6a7bd0, 0x10132a, 0.5));
  const road = floor(0x15182c, 140); g.add(road); city(g);
  for (let z = 30; z > -50; z -= 16) for (const sx of [-1, 1]) { const l = new THREE.PointLight(0xffc878, 16, 14, 1.6); l.position.set(sx * 7, 6, z); g.add(l); const b = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffe2a0 })); b.position.copy(l.position); g.add(b); }
  const stand = new THREE.Group(); stand.add(box(3.2, 2.6, 1.6, 0x2f6a4a, 0, 1.3, 0));
  const head = textPlane('MARKET\nCRASHES', { w: 3, h: 1.2, bg: '#f4efe2', fg: '#c4202e', size: 150 }); head.position.set(0, 1.6, 0.81); stand.add(head);
  const sub = textPlane('S&P 500 -37% · 2008', { w: 3, h: 0.45, bg: '#f4efe2', fg: '#202020', size: 90 }); sub.position.set(0, 0.7, 0.81); stand.add(sub);
  stand.position.set(4.4, 0, -6); stand.rotation.y = -0.35; g.add(stand);
  g.userData.jay = person('jay_worried_hold_box', 1.4, -4.2, 3.4); g.add(g.userData.jay);
  g.add(spot(0xffe0b0, 60, -1, 8, 0, 1.4, 1.6, -4.2, 0.35));
  g.userData.rain = rain(g);
}
function streetScene(t) {
  setScene('street', buildStreet);
  const a = L['VO-04'].start, b = L['VO-05'].start;
  root.userData.rain.userData.update(t);
  const shocked = t > T.shoebox - 0.1;
  root.userData.jay.children[0].material.map = spriteTex(shocked ? 'jay_shocked_hold_box' : 'jay_worried_hold_box');
  if (t < T.shoebox) shot(a - 0.1, T.shoebox, t, [-1.6, 3.0, 16], [0.2, 2.4, 6], [2.4, 1.9, -4.8], [2.0, 1.9, -4.6], 0.02);
  else shot(T.shoebox, b, t, [0.4, 2.1, 0.2], [0.7, 2.0, -0.6], [1.4, 2.7, -4.2], [1.4, 2.8, -4.2], 0.06);
}

function buildClock(g) {
  scene.background = new THREE.Color(0x0a0c20); scene.fog = new THREE.FogExp2(0x0a0c20, 0.03);
  g.add(floor(0x161a33)); g.add(new THREE.HemisphereLight(0x5b6ab8, 0x080810, 0.35)); city(g, 10, -60, 13);
  const board = new THREE.Group();
  board.add(box(9, 5.4, 0.4, 0x0d1022, 0, 0, 0, 0.3));
  g.userData.boardTex = canvasTex((cg, w, h) => {}, 1024, 600);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(8.6, 5), new THREE.MeshBasicMaterial({ map: g.userData.boardTex, toneMapped: false }));
  screen.position.z = 0.22; board.add(screen); board.position.set(0, 6, -8); g.add(board);
  g.userData.maya = person('maya_worried_hold', -2.2, -1, 3.4); g.add(g.userData.maya);
  g.add(spot(0xffd890, 70, -4, 8, 4, -2.2, 1.6, -1, 0.3));
  g.userData.tag = textPlane('BUYS BACK:\nEND OF 2009', { w: 1.9, h: 0.75, bg: '#ffcc40', fg: '#14142a', size: 150 }); g.userData.tag.position.set(-2.2, 4.75, -0.4); g.add(g.userData.tag);
}
function drawBoard(tex, u, label) {
  const c = tex.image, g = c.getContext('2d'), w = c.width, h = c.height;
  g.fillStyle = '#05070f'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#1f2a55'; g.lineWidth = 2; for (let x = 0; x < w; x += 80) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  const pts = [[60, 470], [260, 430], [460, 360], [660, 280], [860, 190], [980, 150]];
  g.strokeStyle = '#5cf08c'; g.lineWidth = 12; g.beginPath(); g.moveTo(...pts[0]);
  const n = Math.max(1, Math.floor(u * (pts.length - 1)));
  for (let i = 1; i <= n; i++) g.lineTo(...pts[i]); g.stroke();
  g.fillStyle = '#5cf08c'; g.font = '900 120px Inter, Arial Black'; g.textAlign = 'right'; g.fillText(label, w - 40, 120);
  tex.needsUpdate = true;
}
function clockScene(t) {
  setScene('clock', buildClock);
  const a = L['VO-05'].start, b = L['VO-06'].start;
  drawBoard(root.userData.boardTex, ease((t - a) / Math.max(0.3, T.rebound - a)), t > T.rebound - 0.6 ? '+26%' : '');
  const k = pop(t, T.later); root.userData.tag.scale.setScalar(Math.max(k, 0.001));
  root.userData.maya.children[0].material.map = spriteTex(t > T.rebound - 0.3 ? 'maya_shocked_hold' : 'maya_worried_hold');
  if (t < T.rebound - 0.3) shot(a - 0.1, T.rebound, t, [-6, 2.0, 9], [-3.5, 2.2, 6], [-1.2, 3.5, -3], [0, 5, -6]);
  else shot(T.rebound - 0.3, b, t, [-2.4, 3.0, 4.6], [-2.3, 3.1, 3.6], [-2.2, 3.1, -1], [-2.2, 3.3, -1], 0.03);
}

function buildRoom(g) {
  scene.background = new THREE.Color(0x120d18); scene.fog = new THREE.FogExp2(0x120d18, 0.04);
  g.add(floor(0x3a2a24)); g.add(new THREE.HemisphereLight(0xa08060, 0x100a08, 0.9)); g.add(spot(0xffe0b0, 80, 1, 8, 4, 1.5, 1.8, -1.0, 0.35));
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 14), new THREE.MeshStandardMaterial({ color: 0x2b2238 })); wall.position.set(0, 7, -5); g.add(wall);
  const win = new THREE.Mesh(new THREE.PlaneGeometry(6, 4), new THREE.MeshBasicMaterial({ map: windowsTex(5, '#ffd27a') })); win.position.set(-4, 5, -4.9); g.add(win);
  g.add(box(5.4, 1.0, 1.8, 0x5a3f7a, 1.5, 0.5, -2.6)); g.add(box(5.4, 1.6, 0.5, 0x5a3f7a, 1.5, 1.3, -3.4));
  const lamp = new THREE.PointLight(0xffb070, 40, 12); lamp.position.set(4.6, 3.2, -2); g.add(lamp);
  g.add(box(0.15, 3, 0.15, 0x333333, 4.6, 1.5, -2.2)); const shade = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.7, 20, 1, true), new THREE.MeshBasicMaterial({ color: 0xffd8a0, side: 2 })); shade.position.set(4.6, 3.2, -2.2); g.add(shade);
  g.userData.sam = person('sam_happy_hold', 1.5, -1.0, 3.2, 0); g.add(g.userData.sam);
  const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.6, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.35, roughness: 0.1 }));
  jar.position.set(-1.6, 0.8, -1.4); g.add(jar);
  g.userData.jarFill = box(1.6, 0.1, 1.6, 0xffc43c, -1.6, 0.05, -1.4, 0.3, 0x553300); g.add(g.userData.jarFill);
  const lbl = textPlane('S&P 500', { w: 1.6, h: 0.5, bg: '#f4efe2', fg: '#1f6b3a', size: 150 }); lbl.position.set(-1.6, 0.9, -0.45); g.add(lbl);
  g.userData.coins = particles(g, 60, 0xffc43c, [1.2, 6, 1.2], 0.3); g.userData.coins.position.set(-1.6, 1.6, -1.4);
  g.userData.tag = textPlane('DIVIDENDS\nREINVESTED', { w: 2.6, h: 1.0, bg: '#2cc46e', fg: '#ffffff', size: 150 }); g.userData.tag.position.set(0.4, 4.9, -2.2); g.add(g.userData.tag);
}
function roomScene(t) {
  setScene('room', buildRoom);
  const a = L['VO-06'].start, b = L['VO-07'].start;
  root.userData.coins.userData.update(t, 3, 6);
  const f = ease((t - a) / (b - a)); root.userData.jarFill.scale.y = 1 + f * 12; root.userData.jarFill.position.y = 0.05 + f * 0.6;
  root.userData.tag.scale.setScalar(Math.max(pop(t, T.dividends - 0.1), 0.001));
  root.userData.sam.children[0].material.map = spriteTex(t > T.dividends ? 'sam_grin_up' : 'sam_happy_hold');
  shot(a - 0.1, b, t, [2.6, 2.8, 6.8], [0.4, 2.6, 5.0], [0.6, 2.4, -2], [0, 2.6, -2]);
}

function buildBedroom(g) {
  scene.background = new THREE.Color(0x06070f); scene.fog = new THREE.FogExp2(0x06070f, 0.04);
  g.add(floor(0x1c1a26)); g.add(new THREE.HemisphereLight(0x303050, 0x050508, 0.25));
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 14), new THREE.MeshStandardMaterial({ color: 0x15172a })); wall.position.set(0, 7, -5); g.add(wall);
  g.userData.tvTex = canvasTex(() => {}, 1024, 576);
  const tv = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 3.0), new THREE.MeshBasicMaterial({ map: g.userData.tvTex, toneMapped: false })); tv.position.set(2.4, 3.6, -4.8); g.add(tv);
  const glow = new THREE.PointLight(0xff4050, 25, 10); glow.position.set(2.4, 3.4, -3.5); g.add(glow);
  g.userData.jay = person('jay_smug_hold_box', -1.2, -2, 3.4); g.add(g.userData.jay);
  g.add(spot(0x9fb4ff, 50, -3, 7, 3, -1.2, 1.6, -2, 0.3));
  g.userData.safe = textPlane('"SAFE"', { w: 2.2, h: 0.85, fg: '#ff5a64', glow: '#ff2030', size: 230 }); g.userData.safe.position.set(-0.8, 4.4, -1.8); g.add(g.userData.safe);
}
function drawTV(tex, t) {
  const c = tex.image, g = c.getContext('2d'), w = c.width, h = c.height;
  g.fillStyle = '#0b0b16'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#ff4050'; g.lineWidth = 12; g.beginPath();
  for (let x = 0; x <= w; x += 20) { const y = h * 0.5 + Math.sin(x / 60 + t * 6) * 70 + Math.sin(x / 23 + t * 9) * 30; x ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke(); g.fillStyle = '#ff4050'; g.font = '900 90px Inter, Arial Black'; g.fillText('MARKET ▼', 40, 110); tex.needsUpdate = true;
}
function bedroomScene(t) {
  setScene('bedroom', buildBedroom);
  const a = L['VO-07'].start, b = L['VO-08'].start;
  drawTV(root.userData.tvTex, t);
  root.userData.safe.scale.setScalar(Math.max(pop(t, T.smart - 0.1), 0.001));
  shot(a - 0.1, b, t, [-1.4, 2.6, 3.2], [-0.6, 3.0, 6.5], [-1.2, 2.8, -2], [0.4, 3.0, -3], 0.02);
}

function buildMistake(g) {
  stage(g, 0x8a1a2a);
  g.userData.jay = person('jay_cry_hold', -1.4, 0, 3.6); g.add(g.userData.jay);
  g.userData.box = textPlane('📦', { w: 1.2, h: 1.2, size: 400 });
  g.userData.maya = person('maya_shocked_hold', 1.6, 0, 3.6); g.add(g.userData.maya);
  g.userData.s1 = spot(0xffb0b4, 55, -1.4, 9, 3, -1.4, 0, 0, 0.25); g.add(g.userData.s1);
  g.userData.s2 = spot(0xffe0a0, 60, 1.6, 9, 3, 1.6, 0, 0, 0.25); g.add(g.userData.s2);
  g.userData.neon = textPlane('THE SHOEBOX\nMISTAKE', { w: 2.9, h: 1.1, fg: '#ff5a64', glow: '#ff1030', size: 190 }); g.userData.neon.position.set(-1.0, 5.0, -1.2); g.add(g.userData.neon);
  g.userData.cost = textPlane('-$1,700', { w: 3.4, h: 1.15, fg: '#ff5a64', glow: '#ff1030', size: 280 }); g.userData.cost.position.set(1.6, 4.6, 0.8); g.add(g.userData.cost);
  g.userData.why = textPlane('MISSED 2009: +26%', { w: 3.4, h: 0.55, bg: '#ffcc40', fg: '#14142a', size: 110 }); g.userData.why.position.set(1.6, 3.7, 0.8); g.add(g.userData.why);
}
function mistakeScene(t) {
  setScene('mistake', buildMistake);
  const a = L['VO-09'].start, b = L['VO-10'].start, u = root.userData;
  u.neon.scale.setScalar(Math.max(pop(t, T.mistake - 0.3), 0.001));
  const showMaya = t > T.mayaCost - 0.15;
  u.s2.children[0].intensity = showMaya ? 60 : 0; u.maya.visible = showMaya;
  u.cost.scale.setScalar(Math.max(pop(t, T.mayaCost), 0.001)); u.why.scale.setScalar(Math.max(pop(t, T.mayaCost + 0.25), 0.001));
  if (!showMaya) shot(a - 0.1, T.mayaCost, t, [-1.0, 3.0, 9.0], [-1.0, 3.2, 7.6], [-1.0, 3.6, -1], [-1.0, 3.7, -1], 0.025);
  else shot(T.mayaCost - 0.15, b, t, [1.8, 3.4, 8.0], [1.6, 3.5, 6.8], [1.6, 3.6, 0], [1.6, 3.7, 0], 0.05);
}

function buildFinal(g) {
  stage(g, 0x4a3a90);
  [['jay_worried_hold', -2.2, 'SELL', '#eb4852'], ['maya_neutral_up', 0, 'WAIT', '#ffcc40'], ['sam_happy_up', 2.2, 'HOLD', '#40c46e']].forEach(([s, x, w, c], i) => {
    g.add(person(s, x, 0, 3.4)); g.add(spot(0xfff2d0, 60, x, 9, 3, x, 0, 0, 0.26));
    const sign = textPlane(w, { w: 1.9, h: 0.8, bg: c, fg: '#ffffff', size: 200 }); sign.position.set(x, 4.2, 0.5); g.add(sign); g.userData['s' + i] = sign;
  });
  g.userData.q = textPlane('?', { w: 3, h: 3, fg: '#ffc43c', glow: '#ffb000', size: 460 }); g.userData.q.position.set(0, 7.2, -7.5); g.add(g.userData.q);
}
function finalScene(t) {
  setScene('final', buildFinal);
  const a = L['VO-10'].start;
  [0, 1, 2].forEach(i => root.userData['s' + i].scale.setScalar(Math.max(pop(t, a + 0.3 + i * 0.35), 0.001)));
  root.userData.q.scale.setScalar(1 + 0.05 * Math.sin(t * 6));
  shot(a - 0.1, a + 4.5, t, [0, 3.0, 12], [0, 3.8, 14.5], [0, 3.6, 0], [0, 4.2, -2]);
}

window.renderAt = (t) => {
  if (t < L['VO-02'].start - 0.05) hook(t);
  else if (t < L['VO-03'].start - 0.05) youScene(t);
  else if (t < L['VO-04'].start - 0.05) { streetScene(t); }   // chart frames replace this window
  else if (t < L['VO-05'].start - 0.05) streetScene(t);
  else if (t < L['VO-06'].start - 0.05) clockScene(t);
  else if (t < L['VO-07'].start - 0.2) roomScene(t);
  else if (t < L['VO-08'].start - 0.1) bedroomScene(t);
  else if (t < L['VO-09'].start - 0.05) mistakeScene(t);  // stack frames replace this window
  else if (t < L['VO-10'].start - 0.2) mistakeScene(t);
  else finalScene(t);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.9);
};
const allLoaded = () => SPRITES.every(n => texCache[n].image && texCache[n].image.complete);
const wait = () => (allLoaded() ? (window.ready = true) : setTimeout(wait, 50));
wait();
</script>
